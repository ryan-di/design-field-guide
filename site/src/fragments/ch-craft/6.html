<div class="note comfy cw-wrap">
  <div class="seg cw-seg" role="radiogroup" aria-label="Example">
    <input type="radio" name="cw-good-motion-w" id="cw-good-motion-w-1" value="ios" checked><label for="cw-good-motion-w-1">iOS</label>
    <input type="radio" name="cw-good-motion-w" id="cw-good-motion-w-2" value="macos"><label for="cw-good-motion-w-2">macOS</label>
    <input type="radio" name="cw-good-motion-w" id="cw-good-motion-w-3" value="gmail"><label for="cw-good-motion-w-3">Gmail</label>
    <input type="radio" name="cw-good-motion-w" id="cw-good-motion-w-4" value="instagram"><label for="cw-good-motion-w-4">Instagram</label>
  </div>
  <div class="cw" data-cw-view role="img" aria-label=""></div>
  <button type="button" class="btn btn-secondary cw-gmo-replay" data-cw-replay><svg class="icon sm"><use href="#i-play"/></svg>Replay</button>
  <p class="cw-cap" data-cw-cap aria-live="polite"></p>
  
  <script>
  (() => {
    const wrap = document.currentScript.closest('.cw-wrap');
    const view = wrap.querySelector('[data-cw-view]'), cap = wrap.querySelector('[data-cw-cap]');
    const svg = (d, cls) => '<svg class="icon sm' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24">' + d + '</svg>';
    const heart = 'M12 20.5s-7.4-4.5-9.2-9.2C1.6 8.1 3.7 4.5 7.3 4.5c2 0 3.6 1.1 4.7 2.7 1.1-1.6 2.7-2.7 4.7-2.7 3.6 0 5.7 3.6 4.5 6.8-1.8 4.7-9.2 9.2-9.2 9.2z';
    const cols = ['ca', 'cb', 'cc', 'cd'];
    let icons = '';
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) icons += '<i class="cw-gmo-ico cw-gmo-' + (r === 1 && c === 1 ? 'cb' : cols[(r + c * 3) % 4]) + '" style="left:' + (11 + c * 26) + 'px;top:' + (14 + r * 30) + 'px"></i>';
    const mrow = (name, c) => '<div class="cw-gmo-row"><i class="cw-gmo-av cw-gmo-' + c + '"></i><b>' + name + '</b><i class="cw-line"></i></div>';
    const S = {
      ios: { html: '<div class="cw-gmo-st"><div class="cw-gmo-phone">' + icons + '<div class="cw-gmo-app"><i class="big"></i><i></i><i class="short"></i><i></i></div></div></div>',
        alt: 'A phone home screen with a grid of app icons. One icon grows until its app fills the screen.',
        cap: 'iOS: an app opens by growing out of its icon and shrinks back into it when you leave, so you see where it lives. With Reduce Motion on, it fades instead.' },
      macos: { html: '<div class="cw-gmo-st"><div class="cw-gmo-desk"><div class="cw-gmo-dock"><i class="cw-gmo-ca"></i><i class="cw-gmo-cb"></i><i class="cw-gmo-cc"></i><i class="cw-gmo-cd"></i><i class="cw-gmo-ca"></i><i class="sep"></i><i class="slot"></i></div>' +
          '<div class="cw-gmo-win"><span class="cw-gmo-bar"><i></i><i></i><i></i></span><i></i><i class="short"></i><i></i></div></div></div>',
        alt: 'A desktop window shrinks and moves down into a slot at the right end of the Dock.',
        cap: 'macOS: a minimized window shrinks down into the Dock. The motion shows where the window went, so you know where to click to get it back.' },
      gmail: { html: '<div class="cw-gmo-st"><div class="cw-gmo-mail">' + mrow('Ana', 'ca') + '<div class="cw-gmo-gone"><span class="cw-gmo-under">' + svg('<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/>') + 'Archive</span>' + mrow('Billing', 'cb') + '</div>' +
          mrow('Sam', 'cc') + mrow('Team', 'cd') + '<div class="toast cw-gmo-snack">Archived<span class="toast-action">Undo</span></div></div></div>',
        alt: 'An inbox list. One email slides off to the right over an Archive color, the rows below move up to fill the gap, and a bar says Archived with Undo.',
        cap: 'Gmail: swipe an email and it slides off the side, then the rows below move up to close the gap. You see that it left and what took its place, and a bar offers Undo.' },
      instagram: { html: '<div class="cw-gmo-st"><div class="cw-gmo-post"><div class="cw-gmo-head"><i class="cw-gmo-av cw-gmo-cb"></i><i class="cw-line"></i></div>' +
          '<div class="cw-gmo-photo"><svg class="cw-gmo-big" viewBox="0 0 24 24"><path d="' + heart + '"/></svg></div>' +
          '<div class="cw-gmo-acts">' + svg('<path d="' + heart + '"/>', 'cw-gmo-like') + svg('<path d="M4 5h16v11H10l-5 4v-4H4z"/>') + svg('<path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/>') + '</div></div></div>',
        alt: 'A photo post. A big heart pops up on the photo and fades, and the small heart under the photo fills in.',
        cap: 'Instagram: double-tap a photo and a big heart pops up on it, then fades, while the small heart below fills in. A little bounce suits this one quick, light action.' }
    };
    let cur = 'ios';
    const render = k => { cur = k; view.innerHTML = S[k].html; view.setAttribute('aria-label', 'Sketch: ' + S[k].alt); cap.textContent = S[k].cap; };
    wrap.querySelectorAll('input[name="cw-good-motion-w"]').forEach(r => r.addEventListener('change', () => render(r.value)));
    wrap.querySelector('[data-cw-replay]').addEventListener('click', () => render(cur));
    render('ios');
  })();
  </script>
</div>
