<div class="stage tall" data-demo="combobox" style="justify-content:flex-start">

        <input class="input" id="d-combo" role="combobox" aria-expanded="false" aria-controls="d-combo-list" aria-autocomplete="list" autocomplete="off" placeholder="Search 11 files">
