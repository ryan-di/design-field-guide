<div class="stage" data-demo="picker">
      <div class="form-card surface">
        <div class="field" style="width:100%">
          <label class="field-label" for="d-hex">Background color</label>
          <div class="color-row"><input type="color" id="d-color" value="#2f5da8" aria-label="Pick a color"><input class="input" id="d-hex" value="#2F5DA8" spellcheck="false" style="font-family:var(--font-mono)"></div>
          <div class="swatches" aria-label="Recent colors"></div>
        </div>
        <div class="field" style="width:100%">
          <label class="field-label" for="d-date">Share link expires</label>
          <input class="input" type="date" id="d-date">

      <p class="try"><b>Try it:</b> pick a color, click a swatch, or type a hex code, and watch the other two follow.</p>
