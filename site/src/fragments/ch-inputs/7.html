<div class="note comfy cw-wrap">
      <div class="seg cw-seg" role="radiogroup" aria-label="Example">
        <input type="radio" name="cw-switch-w" id="cw-switch-w-1" value="ios" checked><label for="cw-switch-w-1">iOS Settings</label>
        <input type="radio" name="cw-switch-w" id="cw-switch-w-2" value="youtube"><label for="cw-switch-w-2">YouTube</label>
        <input type="radio" name="cw-switch-w" id="cw-switch-w-3" value="gmail"><label for="cw-switch-w-3">Gmail</label>
      </div>
      <div class="cw" data-cw-view role="img" aria-label=""></div>
      <p class="cw-cap" data-cw-cap aria-live="polite"></p>
      
      <script>
      (() => {
        const wrap = document.currentScript.closest('.cw-wrap');
        const view = wrap.querySelector('[data-cw-view]'), cap = wrap.querySelector('[data-cw-cap]');
        const ic = id => '<svg class="icon sm"><use href="#i-' + id + '"/></svg>';
        const sw = on => '<span class="cw-swtw-sw' + (on ? ' on' : '') + '"></span>';
        const row = (color, label, end) => '<div class="cw-swtw-row"><i class="cw-swtw-ico" style="background:' + color + '"></i><span class="grow">' + label + '</span>' + end + '</div>';
        const opt = (kind, on, label) => '<span class="cw-swtw-opt"><i class="cw-swtw-' + kind + (on ? ' on' : '') + '"></i>' + label + '</span>';
        const S = {
          ios: { html: '<div class="cw-swtw-phone"><b>Settings</b><div class="cw-swtw-grp">' + row('var(--thumb-b)', 'Airplane Mode', sw(false)) + row('var(--ui-sel)', 'Wi‑Fi', '<em>Home ›</em>') + row('var(--thumb-a)', 'Bluetooth', '<em>On ›</em>') + '</div>' +
              '<div class="cw-swtw-grp">' + row('var(--thumb-c)', 'Notifications', '<em>›</em>') + row('var(--thumb-d)', 'Sounds', '<em>›</em>') + '</div></div>',
            alt: 'A phone settings list. Airplane Mode has a switch, turned off. Wi‑Fi and Bluetooth open their own pages and show their state as words: Home and On.',
            cap: 'iOS Settings: Airplane Mode is a switch right in the list, while rows that open their own page, like Bluetooth, show their state in words.' },
          youtube: { html: '<div class="cw-swtw-yt"><div class="cw-swtw-vid"></div><div class="cw-swtw-bar">' + ic('play') + '<time>1:24 / 8:05</time><span class="grow"></span>' +
              '<span class="cw-swtw-spot">' + sw(true) + '<span class="cw-swtw-tip">Autoplay is on</span></span><span class="cw-swtw-cc">CC</span>' + ic('gear') + ic('fit') + '</div></div>',
            alt: 'A video player’s control bar with a small switch, turned on. A tooltip above it says Autoplay is on.',
            cap: 'YouTube: the autoplay switch sits in the player’s controls. It decides whether the next video starts on its own, and its tooltip says which way it’s set.' },
          gmail: { html: '<div class="cw-swtw-gm"><div class="cw-swtw-tabs"><span class="on">General</span><span>Labels</span><span>Inbox</span></div><div class="cw-swtw-set">' +
              '<b>Conversation view</b><span class="cw-swtw-opts">' + opt('rd', true, 'On') + opt('rd', false, 'Off') + '</span>' +
              '<b>Categories</b><span class="cw-swtw-opts">' + opt('cb', true, 'Social') + opt('cb', true, 'Updates') + opt('cb', false, 'Forums') + '</span>' +
              '<b>Shortcuts</b><span class="cw-swtw-opts">' + opt('rd', false, 'On') + opt('rd', true, 'Off') + '</span></div>' +
              '<div class="cw-swtw-foot"><span class="btn btn-primary">Save Changes</span><span class="btn btn-secondary">Cancel</span></div></div>',
            alt: 'A settings page with radio buttons and checkboxes, no switches, and Save Changes and Cancel buttons at the bottom.',
            cap: 'Gmail: the full settings page has a Save Changes button at the bottom, so it uses radio buttons and checkboxes instead of switches.' }
        };
        const render = k => { view.innerHTML = S[k].html; view.setAttribute('aria-label', 'Sketch: ' + S[k].alt); cap.textContent = S[k].cap; };
        wrap.querySelectorAll('input[name="cw-switch-w"]').forEach(r => r.addEventListener('change', () => render(r.value)));
        render('ios');
      })();
      </script>
    </div>
