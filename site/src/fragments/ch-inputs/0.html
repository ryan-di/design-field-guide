<div class="stage" data-demo="switch">
      <div class="settings surface">
        <label class="switch"><span class="grow">Show grid</span><span class="state" data-for="d-sw-grid">On</span><input type="checkbox" role="switch" id="d-sw-grid" checked></label>
        <label class="switch"><span class="grow">Show last photo</span><span class="state" data-for="d-sw-map">Off</span><input type="checkbox" role="switch" id="d-sw-map"></label>
      </div>
      <div class="preview-box grid" data-preview aria-hidden="true"><span class="minimap" hidden></span></div>
      <p class="try"><b>Try it:</b> flip each switch and watch the preview.</p>
    </div>
