<div class="stage tall" data-demo="good-break-on-purpose">
      <div class="seg p20-bp-seg" role="radiogroup" aria-label="Version">
        <input type="radio" name="p20-bp-mode" id="p20-bp-uniform" value="uniform"><label for="p20-bp-uniform">Uniform</label>
        <input type="radio" name="p20-bp-mode" id="p20-bp-one" value="one" checked><label for="p20-bp-one">Deliberate exception</label>
        <input type="radio" name="p20-bp-mode" id="p20-bp-many" value="many"><label for="p20-bp-many">Exceptions everywhere</label>
      </div>
      <div class="surface p20-bp" id="p20-bp" data-mode="one">
        <p class="p20-bp-title">Document “Budget 2026”</p>
        <ul class="p20-bp-list">
          <li><button class="p20-bp-item" type="button" data-k="rename"><svg class="icon sm"><use href="#i-sliders"/></svg><span>Rename</span></button></li>
          <li><button class="p20-bp-item" type="button" data-k="duplicate"><svg class="icon sm"><use href="#i-layers"/></svg><span>Duplicate</span><span class="p20-bp-new">New</span></button></li>
          <li><button class="p20-bp-item" type="button" data-k="export"><svg class="icon sm"><use href="#i-folder"/></svg><span>Export</span></button></li>
          <li><button class="p20-bp-item" type="button" data-k="share"><svg class="icon sm"><use href="#i-image"/></svg><span>Copy link</span></button></li>
          <li class="p20-bp-sep"><button class="p20-bp-item" type="button" data-k="delete"><svg class="icon sm"><use href="#i-trash"/></svg><span>Delete document</span></button></li>
        </ul>
      </div>
      <p class="state-caption p20-bp-cap" id="p20-bp-cap" aria-live="polite"></p>
      <p class="try"><b>Try it:</b> switch between the three versions and notice where your eye lands first. Then find “Delete document” in each one, and note how long it takes.</p>
    </div>
