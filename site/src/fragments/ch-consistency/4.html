<script>
(() => {
  const cs = document.currentScript.closest('.cs');
  /* Part 1 sits above the shared case helpers in the book, so wait for them. */
  const run = () => {
  const D = (k, html, wire) => csDemo(cs.querySelector('[data-d="' + k + '"]'), html, wire);
  const css = document.createElement('style');
  css.textContent = `
#good-consistency .cn-app{width:min(340px,100%)}
#good-consistency .cn-body{background:var(--ui-surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
#good-consistency .cn-prod{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--ui-border)}
#good-consistency .cn-prod .grow,#good-consistency .cn-item .grow{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3;font-size:14px}
#good-consistency .cn-th{width:44px;height:44px;aspect-ratio:auto;flex:none;border-radius:8px}
#good-consistency .cn-th.s{width:32px;height:32px}
#good-consistency .cn-h{margin:6px 0 0;font:600 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ui-muted)}
#good-consistency .cn-item{display:flex;align-items:center;gap:10px;padding:6px 0}
#good-consistency .cn-link{color:var(--ui-sel);font-size:13.5px;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
#good-consistency .cn-link:focus-visible{outline:2px solid var(--ui-sel);outline-offset:2px}
#good-consistency .cn-cart{font:500 12.5px var(--font-mono);color:var(--ui-muted)}
#good-consistency .cn-out{text-align:center;max-width:min(330px,100%);min-height:18px;margin:0;font:500 12.5px/1.45 var(--font-mono);color:var(--ui-muted)}
#good-consistency .cn-trv{position:relative;width:min(320px,100%);height:300px;display:flex;flex-direction:column}
#good-consistency .cn-view{flex:1 1 auto;min-height:0;justify-content:flex-start;background:var(--ui-surface);padding:12px 14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
#good-consistency .cn-hotel{flex:none;display:flex;flex-direction:column;gap:6px;border:1px solid var(--ui-border);border-radius:10px;padding:10px;font-size:14px}
#good-consistency .cn-hotel .btn{align-self:flex-start}
#good-consistency .cn-tabs{display:flex;justify-content:space-around;border-top:1px solid var(--ui-border);background:var(--ui-surface);padding:4px}
#good-consistency .cn-tabs .cs-tab{position:relative}
#good-consistency .cn-trv .cs-toasts{bottom:56px}
#good-consistency .cn-ph{width:min(320px,100%);background:var(--ui-surface);border:1px solid var(--ui-border);border-radius:12px;box-shadow:var(--ui-shadow);padding:10px;display:flex;flex-direction:column;gap:8px}
#good-consistency .cn-bar{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
#good-consistency .cn-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
#good-consistency .cn-grid .thumb{aspect-ratio:1;border-radius:4px;position:relative}
#good-consistency .cn-grid .thumb.sel{outline:3px solid var(--ui-sel);outline-offset:-3px}
#good-consistency .cn-grid .thumb.sel::after{content:"✓";position:absolute;right:3px;bottom:3px;width:16px;height:16px;border-radius:50%;background:var(--ui-sel);color:var(--ui-on-sel);font:700 11px/16px var(--font-body);text-align:center}
#good-consistency .cn-ph-wrap{position:relative;width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:10px}
`;
  cs.prepend(css);

  /* 1. One action, one look */
  const shop = fixed => {
    const act = name => fixed ? '<button class="btn btn-primary cs-sm" type="button" data-add="' + name + '">Add to cart</button>'
      : '<a class="cn-link" href="#" data-add="' + name + '">Add to cart →</a>';
    const item = (name, price, c) => '<div class="cn-item"><span class="thumb cn-th s' + c + '"></span><span class="grow"><span>' + name + '</span><span class="cs-meta">' + price + '</span></span>' + act(name) + '</div>';
    return '<div class="app-frame cn-app"><div class="app-bar"><span>Home goods</span><span class="cn-cart" data-cart>Cart (0)</span></div><div class="cn-body">' +
      '<div class="cn-prod"><span class="thumb cn-th"></span><span class="grow"><b>Desk lamp</b><span class="cs-meta">€39</span></span><button class="btn btn-primary cs-sm" type="button" data-add="Desk lamp">Add to cart</button></div>' +
      '<p class="cn-h">Your wishlist</p>' + item('Mug', '€12', ' b') + item('Throw blanket', '€45', ' c') + '</div></div><p class="cn-out" aria-live="polite" data-out></p>';
  };
  const wireShop = fixed => d => {
    let n = 0;
    const cart = d.querySelector('[data-cart]'), out = d.querySelector('[data-out]');
    d.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', e => {
      e.preventDefault();
      n++; cart.textContent = 'Cart (' + n + ')';
      out.textContent = b.dataset.add + ' added to cart.' + (!fixed && b.tagName === 'A' ? ' The link looked like it would open a page.' : '');
    }));
  };
  D('good-consistency-1b', shop(false), wireShop(false));
  D('good-consistency-1f', shop(true), wireShop(true));

  /* 2. One thing, one name */
  const travel = fixed => '<div class="app-frame cn-trv"><div class="app-bar"><span>Travel</span></div><div class="cn-view" data-view></div>' +
    '<div class="cn-tabs" role="tablist" aria-label="Sections">' + ['Explore', 'Trips', 'Account'].map((t, i) => '<button class="cs-tab' + (i ? '' : ' on') + '" type="button" role="tab" aria-selected="' + (i ? 'false' : 'true') + '" data-tab="' + t + '">' + t + '</button>').join('') + '</div></div>';
  const wireTravel = fixed => (d, t) => {
    let added = false;
    const view = d.querySelector('[data-view]'), frame = d.querySelector('.cn-trv');
    const V = {
      Explore: () => '<div class="cn-hotel"><b>Hotel Mar, Lisbon</b><span class="cs-meta">12–14 May · 2 guests · €248</span>' +
        '<button class="btn btn-primary cs-sm" type="button" data-book' + (added ? ' disabled' : '') + '>' + (added ? (fixed ? 'In your Trips' : 'In your bookings') : (fixed ? 'Add to Trips' : 'Add to my bookings')) + '</button></div>' +
        '<div class="cn-hotel"><b>Casa Azul, Porto</b><span class="cs-meta">15–17 May · 2 guests · €196</span></div>',
      Trips: () => added ? '<div class="cn-hotel"><b>Hotel Mar, Lisbon</b><span class="cs-meta">12–14 May · 2 guests</span></div>' : '<span class="cs-meta">No trips yet.</span>',
      Account: () => '<div class="cs-row"><span>Profile</span></div><div class="cs-row"><span>Payment methods</span></div><div class="cs-row"><span>Help</span></div>'
    };
    const show = k => {
      d.querySelectorAll('[data-tab]').forEach(b => { const on = b.dataset.tab === k; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); });
      view.innerHTML = V[k]();
      const bk = view.querySelector('[data-book]');
      if (bk) bk.addEventListener('click', () => {
        added = true; show('Explore');
        csToast(frame, t, fixed ? 'Added to Trips.' : 'Saved to your reservations.', { replace: true });
        if (fixed) { const tb = d.querySelector('[data-tab="Trips"]'); if (!tb.querySelector('.badge')) tb.insertAdjacentHTML('beforeend', '<span class="badge">1</span>'); }
      });
    };
    d.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
    show('Explore');
  };
  D('good-consistency-2b', travel(false), wireTravel(false));
  D('good-consistency-2f', travel(true), wireTravel(true));

  /* 3. Platform convention */
  const photos = '<div class="cn-ph-wrap"><div class="cn-ph"><div class="cn-bar"><span data-count>3 selected</span><button class="btn btn-danger cs-sm" type="button" data-del>Delete</button></div><div class="cn-grid" data-grid>' +
    ['', ' b', ' c', '', ' c', ' b', '', ' b'].map((c, i) => '<span class="thumb' + c + (i < 3 ? ' sel' : '') + '"></span>').join('') + '</div></div><p class="cn-out" aria-live="polite" data-out></p></div>';
  const wirePhotos = fixed => d => {
    const out = d.querySelector('[data-out]'), del = d.querySelector('[data-del]');
    const close = () => { const m = d.querySelector('.cs-modal'); if (m) m.remove(); };
    const doDelete = () => { close(); d.querySelectorAll('.thumb.sel').forEach(x => x.remove()); d.querySelector('[data-count]').textContent = '0 selected'; del.disabled = true; out.textContent = '3 photos deleted.' + (fixed ? '' : ' The left button was Delete, not Cancel.'); };
    const doCancel = () => { close(); out.textContent = 'Cancelled. Nothing was deleted.'; del.focus(); };
    del.addEventListener('click', () => {
      const btn = { del: '<button class="btn btn-danger cs-sm" type="button" data-yes>Delete</button>', no: '<button class="btn btn-secondary cs-sm" type="button" data-no>Cancel</button>' };
      d.insertAdjacentHTML('beforeend', '<div class="cs-modal"><div class="cs-dlg" role="alertdialog" aria-modal="true" aria-label="Delete 3 photos?"><b>Delete 3 photos?</b><p>This can’t be undone.</p><div class="acts">' + (fixed ? btn.no + btn.del : btn.del + btn.no) + '</div></div></div>');
      const m = d.querySelector('.cs-modal');
      m.querySelector('[data-yes]').addEventListener('click', doDelete);
      m.querySelector('[data-no]').addEventListener('click', doCancel);
      m.addEventListener('keydown', e => { if (e.key === 'Escape') doCancel(); });
      m.querySelector('[data-no]').focus();
    });
  };
  D('good-consistency-3b', photos, wirePhotos(false));
  D('good-consistency-3f', photos, wirePhotos(true));

  csInit(cs);
  };
  if (window.csDemo) run(); else document.addEventListener('DOMContentLoaded', run);
})();

</script>
