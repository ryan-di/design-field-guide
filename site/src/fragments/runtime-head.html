<script>
window.csInit = cs => {
  const chips = Array.from(cs.querySelectorAll('.cs-chip')), cases = Array.from(cs.querySelectorAll('.cs-case'));
  if (!chips.length) { cases.forEach(p => { p.hidden = false; }); if (window.csToggle) csToggle(cs); return; }
  const show = i => {
    chips.forEach((c, k) => { const on = k === i; c.setAttribute('aria-selected', String(on)); c.tabIndex = on ? 0 : -1; });
    cases.forEach((p, k) => { if (!p.hidden && k !== i) p.dispatchEvent(new Event('cs:hide')); const was = p.hidden; p.hidden = k !== i; if (was && k === i) p.dispatchEvent(new Event('cs:show')); });
  };
  chips.forEach((c, i) => {
    c.addEventListener('click', () => show(i));
    c.addEventListener('keydown', e => {
      const k = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: chips.length - 1 }[e.key];
      if (k === undefined) return;
      e.preventDefault(); const n = (k + chips.length) % chips.length; show(n); chips[n].focus();
    });
  });
  if (window.csToggle) csToggle(cs);
  show(0);
};
window.csToggle = cs => {
  cs.querySelectorAll('.cs-case').forEach(c => {
    const panel = c.querySelector('.cs-panel'), btns = Array.from(c.querySelectorAll('.cs-switch button')), sides = Array.from(c.querySelectorAll('.cs-side'));
    const set = mode => {
      panel.dataset.mode = mode;
      btns.forEach(b => { const on = b.dataset.mode === mode; b.setAttribute('aria-checked', String(on)); b.tabIndex = on ? 0 : -1; });
      sides.forEach(s => { s.hidden = s.dataset.mode !== mode; });
    };
    btns.forEach((b, i) => {
      b.addEventListener('click', () => set(b.dataset.mode));
      b.addEventListener('keydown', e => { if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) { e.preventDefault(); const n = btns[1 - i]; set(n.dataset.mode); n.focus(); } });
    });
    set('broken');
  });
};
window.csDemo = (demo, html, wire) => {
  let ids = [];
  const t = {
    after: (fn, ms) => { const id = setTimeout(fn, ms); ids.push(id); return id; },
    every: (fn, ms) => { const id = setInterval(fn, ms); ids.push(id); return id; },
    clear: () => { ids.forEach(id => { clearTimeout(id); clearInterval(id); }); ids = []; }
  };
  const run = () => { t.clear(); demo.innerHTML = html; wire(demo, t); };
  const side = demo.closest('.cs-side'), r = side && side.querySelector('.cs-reset');
  if (r) r.addEventListener('click', run);
  demo.closest('.cs-case').addEventListener('cs:hide', run);
  run();
};
window.csToast = (demo, t, text, opts = {}) => {
  let st = demo.querySelector('.cs-toasts');
  if (!st) { st = document.createElement('div'); st.className = 'cs-toasts'; st.setAttribute('role', 'status'); demo.appendChild(st); }
  if (opts.replace) st.innerHTML = '';
  const el = document.createElement('div'); el.className = 'toast' + (opts.tone ? ' toast-' + opts.tone : '');
  const sp = document.createElement('span'); sp.textContent = text; el.appendChild(sp);
  if (opts.action) { const b = document.createElement('button'); b.type = 'button'; b.className = 'toast-action'; b.textContent = opts.action.label; b.addEventListener('click', () => { el.remove(); opts.action.run(); }); el.appendChild(b); }
  st.appendChild(el);
  el.hide = () => { el.classList.add('leaving'); t.after(() => el.remove(), 220); };
  if (opts.ms !== 0) t.after(el.hide, opts.ms || 4000);
  return el;
};
</script>
