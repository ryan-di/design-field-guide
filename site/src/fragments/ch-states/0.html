<div class="stage tall" data-demo="states">
      <button class="btn btn-primary" type="button" id="d-state-btn"><svg class="icon sm"><use href="#i-play"/></svg><span>Play</span></button>
      <p class="state-caption" data-cap aria-live="polite"></p>
      <div class="state-picker" role="group" aria-label="Show a state">
        <button type="button" data-state="default" aria-pressed="true">Default</button>
        <button type="button" data-state="hover" aria-pressed="false">Hover</button>
        <button type="button" data-state="focus" aria-pressed="false">Focus</button>
        <button type="button" data-state="pressed" aria-pressed="false">Pressed</button>
        <button type="button" data-state="disabled" aria-pressed="false">Disabled</button>
        <button type="button" data-state="loading" aria-pressed="false">Loading</button>
        <button type="button" data-state="error" aria-pressed="false">Error</button>
        <button type="button" data-state="success" aria-pressed="false">Success</button>
      </div>
    </div>
