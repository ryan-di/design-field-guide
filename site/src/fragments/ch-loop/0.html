<div class="stage tall" data-demo="eff-loop">
      <div class="p25-loop">
        <div class="p25-ring" id="p25-ring">
          <svg class="p25-arcs" id="p25-arcs" viewBox="0 0 340 320" aria-hidden="true" focusable="false">
            <defs>
              <marker id="p25-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="p25-arrowhead"/></marker>
              <marker id="p25-arrow-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="p25-arrowhead-back"/></marker>
            </defs>
          </svg>
          <ol class="p25-stages" id="p25-stages" aria-label="Stages of the loop"></ol>
          <div class="p25-center">
