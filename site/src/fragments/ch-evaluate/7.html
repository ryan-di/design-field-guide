<div class="stage tall" data-demo="eff-measure">
      <div class="p30-me">
        <div class="seg p30-seg" role="radiogroup" aria-label="Success criterion">
          <input type="radio" name="p30-me-c" id="p30-me-c1" value="back" checked><label for="p30-me-c1">Work comes back</label>
          <input type="radio" name="p30-me-c" id="p30-me-c2" value="reports"><label for="p30-me-c2">Fewer reports</label>
          <input type="radio" name="p30-me-c" id="p30-me-c3" value="slow"><label for="p30-me-c3">No slowdown</label>
        </div>
        <div class="surface p30-panel">
          <p class="p30-ph">From the brief</p>
          <p class="p30-crit" id="p30-me-crit"></p>
          <fieldset class="p30-fs">
            <legend class="field-label">Which number answers it?</legend>
            <div id="p30-me-opts" class="p30-opts"></div>
          </fieldset>
          <p class="p30-mv" id="p30-me-verdict" aria-live="polite"></p>
        </div>
        <div class="surface p30-panel">
          <p class="p30-ph">Measurement plan</p>
          <ul class="p30-plan" id="p30-me-plan"></ul>
        </div>
      </div>
      <p class="try"><b>Try it:</b> for each criterion, try all three numbers. Only one of each three really answers it. Fill the plan with those.</p>
    </div>
