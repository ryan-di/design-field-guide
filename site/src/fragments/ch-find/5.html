<div class="cs-case" aria-label="Use one well-known shortcut"><div class="cs-panel"><div class="cs-bar"><div class="cs-switch" role="radiogroup" aria-label="Show"><button type="button" role="radio" class="b" data-mode="broken"><span class="dot"></span>When it backfires</button><button type="button" role="radio" class="f" data-mode="fixed"><span class="dot"></span>Do this instead</button></div></div><section class="cs-side" data-mode="broken"><div class="cs-demo" data-d="pat-command-palette-4b"></div><div class="cs-foot"><p class="fig-cap">The “/” key opens the palette, even while people type a note. <b>Try:</b> type “and/or” in the note.</p><button class="cs-reset" type="button">Reset</button></div></section><section class="cs-side" data-mode="fixed"><div class="cs-demo" data-d="pat-command-palette-4f"></div><div class="cs-foot"><p class="fig-cap">Only Ctrl+K or ⌘K opens it, and every other key types. <b>Try:</b> type “and/or” in the note, then press Ctrl+K or ⌘K.</p><button class="cs-reset" type="button">Reset</button></div></section></div></div>
