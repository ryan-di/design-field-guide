<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  };
  const KEY = 'cfg-learned-v1';
  const demo = (name, fn) => $$('[data-demo="' + name + '"]').forEach(st => { try { fn(st); } catch (e) { console.error('demo ' + name, e); } });

  /* ---------- Review checklist (not saved) ---------- */
  $$('[data-checklist]').forEach(cl => {
    const boxes = $$('input[type="checkbox"]', cl), count = $('[data-cl-count]', cl);
    const sync = () => { count.textContent = boxes.filter(b => b.checked).length + ' of ' + boxes.length + ' checked'; };
    boxes.forEach(b => b.addEventListener('change', sync));
    $('[data-cl-reset]', cl).addEventListener('click', () => { boxes.forEach(b => { b.checked = false; }); sync(); });
    sync();
  });

  /* ---------- Shared helpers ---------- */
  function toast(stage, text, opts = {}) {
    if (!stage) return;
    let stack = stage.querySelector(':scope > .toast-stack');
    if (!stack) {
      stack = document.createElement('div');
      stack.className = 'toast-stack';
      stack.setAttribute('role', 'status');
      stack.setAttribute('aria-live', 'polite');
      stage.appendChild(stack);
    }
    const t = document.createElement('div');
    t.className = 'toast' + (opts.tone ? ' toast-' + opts.tone : '');
    const span = document.createElement('span'); span.textContent = text; t.appendChild(span);
    let timer;
    const remove = () => { clearTimeout(timer); t.classList.add('leaving'); setTimeout(() => t.remove(), 220); };
    const start = () => { clearTimeout(timer); timer = setTimeout(remove, opts.duration || 4500); };
    if (opts.action) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'toast-action'; b.textContent = opts.action.label;
      b.addEventListener('click', () => { remove(); opts.action.run(); });
      t.appendChild(b);
    }
    t.addEventListener('mouseenter', () => clearTimeout(timer));
    t.addEventListener('mouseleave', start);
    t.addEventListener('focusin', () => clearTimeout(timer));
    t.addEventListener('focusout', start);
    stack.appendChild(t);
    while (stack.children.length > 3) stack.firstElementChild.remove();
    start();
    return t;
  }

  // Forms on this page are demos: never submit anywhere (dialog forms close their dialog).
  document.addEventListener('submit', e => { if ((e.target.getAttribute('method') || '').toLowerCase() !== 'dialog') e.preventDefault(); });

  // Popovers and menus
  const openPops = new Set();
  const triggerFor = pop => document.querySelector('[data-pop="' + pop.id + '"]');
  function closePop(pop, focusTrigger) {
    if (!pop || pop.hidden) return;
    pop.hidden = true; openPops.delete(pop);
    const t = triggerFor(pop);
    if (t) { t.setAttribute('aria-expanded', 'false'); if (focusTrigger) t.focus(); }
  }
  function openPop(pop, trigger) {
    openPops.forEach(p => { if (p !== pop) closePop(p); });
    pop.hidden = false; openPops.add(pop);
    trigger.setAttribute('aria-expanded', 'true');
    const first = pop.querySelector('[role="menuitem"], input, select, button');
    if (first) first.focus({ preventScroll: true });
  }
  document.addEventListener('click', e => {
    const trig = e.target.closest('[data-pop]');
    if (trig) {
      const pop = document.getElementById(trig.dataset.pop);
      if (pop.hidden) openPop(pop, trig); else closePop(pop);
      return;
    }
    openPops.forEach(p => { if (!p.contains(e.target)) closePop(p); });
    const say = e.target.closest('[data-say]');
    if (say && !say.closest('.menu') && !say.closest('[data-demo="buttons"]')) toast(say.closest('.stage'), say.dataset.say);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') openPops.forEach(p => closePop(p, true)); });
  $$('.menu').forEach(menu => {
    menu.addEventListener('keydown', e => {
      const items = $$('[role="menuitem"]', menu);
      const i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
      else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
      else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
      else if (e.key === 'Tab') { closePop(menu); }
    });
    menu.addEventListener('click', e => {
      const it = e.target.closest('[role="menuitem"]');
      if (!it) return;
      const st = menu.closest('.stage');
      closePop(menu, true);
      const say = it.dataset.say || it.textContent.trim();
      if (/ · Undo$/.test(say)) toast(st, say.replace(/ · Undo$/, ''), { action: { label: 'Undo', run: () => toast(st, 'Restored') } });
      else toast(st, say);
    });
  });

  /* ---------- Learned progress ---------- */
  const learned = new Set(store.get(KEY, []));
  const syncLearned = () => $$('[data-learned]').forEach(cb => { cb.checked = learned.has(cb.dataset.learned); });
  document.addEventListener('change', e => {
    const cb = e.target.closest && e.target.closest('[data-learned]');
    if (!cb) return;
    if (cb.checked) learned.add(cb.dataset.learned); else learned.delete(cb.dataset.learned);
    store.set(KEY, Array.from(learned));
    syncLearned();
  });
  syncLearned();
  window.dfg = { $, $$, store, demo, toast };
})();
</script>
