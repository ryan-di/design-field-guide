    <div><h4>How urgent is it?</h4><p>Sets how much it may interrupt: its step on the <a href="../../part-3/start/#ch-start">interruption ladder</a>.</p></div>
    <div><h4>How long must it stay?</h4><p>Sets whether it fades, stays while true, or waits for an answer.</p></div>
    <div><h4>What must people do?</h4><p>Sets whether it holds words, buttons, or a whole form.</p></div>
