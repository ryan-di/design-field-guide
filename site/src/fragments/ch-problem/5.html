<script>
(() => {
  const cs = document.currentScript.closest('.cs');
  /* The shared case helpers are defined later in the book, so wait for them. */
  const start = () => {
  const D = (k, html, wire) => csDemo(cs.querySelector('[data-d="' + k + '"]'), html, wire);
  const css = document.createElement('style');
  css.textContent = `
#good-needs-hierarchy .nh-app{width:min(340px,100%)}
#good-needs-hierarchy .nh-app .app-body{padding:10px 14px;gap:0;min-height:170px}
#good-needs-hierarchy .nh-tabs{display:flex;gap:2px}
#good-needs-hierarchy .nh-rec{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--ui-border)}
#good-needs-hierarchy .nh-rec:last-child{border-bottom:0}
#good-needs-hierarchy .nh-rec .thumb{width:44px;flex:none}
#good-needs-hierarchy .nh-rec .grow{flex:1;min-width:0;font-size:14px}
#good-needs-hierarchy .nh-heart{width:36px;height:36px;color:var(--ui-muted);position:relative}
#good-needs-hierarchy .nh-heart svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
#good-needs-hierarchy .nh-heart[aria-pressed="true"]{color:var(--ui-danger)}
#good-needs-hierarchy .nh-heart[aria-pressed="true"] svg{fill:currentColor}
#good-needs-hierarchy .nh-pop{animation:nh-pop .5s ease}
@keyframes nh-pop{0%{transform:scale(1)}40%{transform:scale(1.45) rotate(-8deg)}100%{transform:scale(1)}}
#good-needs-hierarchy .nh-yum{position:absolute;right:42px;top:6px;white-space:nowrap;font:700 12.5px var(--font-body);color:var(--ui-danger);animation:nh-up 1.1s ease forwards;pointer-events:none}
@keyframes nh-up{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#good-needs-hierarchy .nh-empty{color:var(--ui-muted);font-size:14px;padding:24px 0;text-align:center}
#good-needs-hierarchy .nh-cases{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;width:min(340px,100%)}
#good-needs-hierarchy .nh-cases .cs-tab[aria-pressed="true"]{background:var(--ui-hover);color:var(--ui-text);box-shadow:inset 0 0 0 1px var(--ui-border)}
#good-needs-hierarchy .nh-mail{display:flex;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ui-border);font-size:14px}
#good-needs-hierarchy .nh-mail:last-child{border-bottom:0}
#good-needs-hierarchy .nh-mail .av{width:26px;height:26px;border-radius:50%;background:var(--thumb-a);flex:none}
#good-needs-hierarchy .nh-mail .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#good-needs-hierarchy .nh-state{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:26px 6px;color:var(--ui-muted);font-size:14px}
#good-needs-hierarchy .nh-state b{color:var(--ui-text)}
#good-needs-hierarchy .nh-task{padding:6px 0;font-size:14.5px}
#good-needs-hierarchy .nh-task input:checked + span{color:var(--ui-muted);text-decoration:line-through}
#good-needs-hierarchy .nh-done{display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--ui-ok) 14%,var(--ui-surface));font-size:14px}
#good-needs-hierarchy .nh-done svg{width:30px;height:30px;flex:none;color:var(--ui-ok)}
#good-needs-hierarchy .nh-done circle{stroke-dasharray:70;stroke-dashoffset:70;animation:nh-draw .5s ease forwards}
#good-needs-hierarchy .nh-done path{stroke-dasharray:20;stroke-dashoffset:20;animation:nh-draw .3s .45s ease forwards}
@keyframes nh-draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){#good-needs-hierarchy .nh-pop,#good-needs-hierarchy .nh-yum{animation:none}#good-needs-hierarchy .nh-done circle,#good-needs-hierarchy .nh-done path{animation:none;stroke-dashoffset:0}}
#good-needs-hierarchy .nh-line{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--ui-border)}
#good-needs-hierarchy .nh-pay{width:100%;justify-content:center;margin-top:10px}
#good-needs-hierarchy .nh-msg{margin-top:10px;font-size:14px;line-height:1.45}
#good-needs-hierarchy .nh-msg:empty{display:none}
#good-needs-hierarchy .nh-joke{text-align:center;font-weight:600}
#good-needs-hierarchy .nh-err{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:9px;border:1.5px solid var(--ui-danger);background:var(--ui-danger-soft)}
#good-needs-hierarchy .nh-ok{display:flex;align-items:center;gap:8px;color:var(--ui-ok);font-weight:600}
`;
  cs.appendChild(css);
  const heart = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.3a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></svg>';
  const tick = '<svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="15" cy="15" r="11"/><path d="M10 15.5l3.5 3.5 7-7.5"/></svg>';

  /* 1. Polish before it works */
  const RECIPES = [['Lemon pasta', '20 min', ''], ['Green curry', '35 min', ' c'], ['Banana bread', '1 h 10 min', '']];
  const recHtml = '<div class="app-frame nh-app"><div class="app-bar"><span>Recipes</span><span class="nh-tabs"><button class="cs-tab on" type="button" data-tab="all" aria-pressed="true">All</button><button class="cs-tab" type="button" data-tab="saved" aria-pressed="false">Saved <span data-n>0</span></button></span></div><div class="app-body" data-body></div></div>';
  const recWire = fixed => (d, t) => {
    const saved = new Set(), hearts = new Set(), body = d.querySelector('[data-body]');
    let tab = 'all';
    const render = () => {
      d.querySelectorAll('[data-tab]').forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
      d.querySelector('[data-n]').textContent = saved.size;
      if (tab === 'saved') {
        body.innerHTML = saved.size ? RECIPES.filter((r, i) => saved.has(i)).map(r => '<div class="nh-rec"><span class="thumb' + r[2] + '"></span><span class="grow"><b>' + r[0] + '</b><br><span class="cs-meta">' + r[1] + '</span></span></div>').join('') : '<p class="nh-empty">No saved recipes yet.</p>';
        return;
      }
      body.innerHTML = RECIPES.map((r, i) => '<div class="nh-rec"><span class="thumb' + r[2] + '"></span><span class="grow"><b>' + r[0] + '</b><br><span class="cs-meta">' + r[1] + '</span></span><button class="icon-btn nh-heart" type="button" aria-pressed="' + hearts.has(i) + '" aria-label="Save ' + r[0] + '" data-i="' + i + '">' + heart + '</button></div>').join('');
      body.querySelectorAll('[data-i]').forEach(b => b.addEventListener('click', () => {
        const i = Number(b.dataset.i), on = !hearts.has(i);
        if (on) hearts.add(i); else hearts.delete(i);
        b.setAttribute('aria-pressed', String(on));
        if (fixed) { if (on) saved.add(i); else saved.delete(i); d.querySelector('[data-n]').textContent = saved.size; return; }
        if (!on) return;
        b.classList.remove('nh-pop'); void b.offsetWidth; b.classList.add('nh-pop');
        const y = document.createElement('span'); y.className = 'nh-yum'; y.textContent = 'Yum! Saved!'; b.parentNode.style.position = 'relative'; b.parentNode.appendChild(y);
        t.after(() => y.remove(), 1100);
      }));
    };
    d.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); }));
    render();
  };
  D('good-needs-hierarchy-1b', recHtml, recWire(false));
  D('good-needs-hierarchy-1f', recHtml, recWire(true));

  /* 2. Only the happy path */
  const MAIL = [['Ana', 'Photos from Saturday'], ['Bank', 'Your statement is ready'], ['Leo', 'Dinner on Friday?']];
  const mailRows = MAIL.map((m, i) => '<div class="nh-mail"><span class="av" style="background:var(--thumb-' + 'abc'[i] + ')"></span><span class="grow"><b>' + m[0] + '</b> · ' + m[1] + '</span></div>').join('');
  const CASES = [['ok', 'Normal'], ['slow', 'Slow network'], ['empty', 'Empty'], ['error', 'Error']];
  const inboxHtml = '<div class="app-frame nh-app"><div class="app-bar"><span>Inbox</span></div><div class="app-body" data-body aria-live="polite"></div></div>' +
    '<div class="nh-cases" role="group" aria-label="Case">' + CASES.map(c => '<button class="cs-tab" type="button" data-case="' + c[0] + '" aria-pressed="false">' + c[1] + '</button>').join('') + '</div>';
  const inboxWire = fixed => (d, t) => {
    const body = d.querySelector('[data-body]');
    const loading = () => '<div class="nh-state"><span class="spinner"></span>Loading your mail…</div>';
    const show = k => {
      t.clear();
      d.querySelectorAll('[data-case]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.case === k)));
      if (k === 'ok') { body.innerHTML = mailRows; return; }
      if (k === 'slow') { body.innerHTML = fixed ? loading() : ''; t.after(() => { body.innerHTML = mailRows; }, 2600); return; }
      if (k === 'empty') { body.innerHTML = fixed ? '<div class="nh-state"><b>No mail yet</b>New messages show up here.</div>' : ''; return; }
      if (!fixed) { body.innerHTML = ''; return; }
      body.innerHTML = '<div class="nh-state"><b>Couldn’t load your mail</b>Check your connection and try again.<button class="btn btn-secondary cs-sm" type="button" data-retry>Retry</button></div>';
      body.querySelector('[data-retry]').addEventListener('click', () => { body.innerHTML = loading(); t.after(() => { body.innerHTML = mailRows; }, 900); });
    };
    d.querySelectorAll('[data-case]').forEach(b => b.addEventListener('click', () => show(b.dataset.case)));
    show('ok');
  };
  D('good-needs-hierarchy-2b', inboxHtml, inboxWire(false));
  D('good-needs-hierarchy-2f', inboxHtml, inboxWire(true));

  /* 3. Delight never comes */
  const TASKS = [['Pay the phone bill', true], ['Book the dentist', true], ['Return the library books', false], ['Water the plants', false]];
  const todoHtml = '<div class="app-frame nh-app"><div class="app-bar"><span>Today</span><span class="cs-meta" data-count></span></div><div class="app-body">' +
    TASKS.map(x => '<label class="check nh-task"><input type="checkbox"' + (x[1] ? ' checked' : '') + '><span>' + x[0] + '</span></label>').join('') + '<div data-end aria-live="polite"></div></div></div>';
  const todoWire = fixed => d => {
    const boxes = Array.from(d.querySelectorAll('input')), end = d.querySelector('[data-end]');
    const render = () => {
      const n = boxes.filter(b => b.checked).length;
      d.querySelector('[data-count]').textContent = n + ' of ' + boxes.length + ' done';
      const all = n === boxes.length;
      if (!fixed || !all) { end.innerHTML = ''; return; }
      if (!end.innerHTML) end.innerHTML = '<div class="nh-done">' + tick + '<span><b>All done for today.</b><br>Four things off your mind.</span></div>';
    };
    boxes.forEach(b => b.addEventListener('change', render));
    render();
  };
  D('good-needs-hierarchy-3b', todoHtml, todoWire(false));
  D('good-needs-hierarchy-3f', todoHtml, todoWire(true));

  /* 4. Joke over a failure */
  const payHtml = '<div class="app-frame nh-app"><div class="app-bar"><span>Checkout</span></div><div class="app-body">' +
    '<div class="nh-line"><span>Running shoes</span><b>€89.00</b></div><div class="nh-line"><span>Pay with</span><span data-card>Visa ending 4242</span></div>' +
    '<button class="btn btn-primary nh-pay" type="button" data-pay>Pay €89.00</button><div class="nh-msg" data-msg aria-live="polite"></div></div></div>';
  const payWire = fixed => (d, t) => {
    const pay = d.querySelector('[data-pay]'), msg = d.querySelector('[data-msg]'), card = d.querySelector('[data-card]');
    let good = false;
    pay.addEventListener('click', () => {
      pay.disabled = true; pay.innerHTML = '<span class="spinner"></span>Paying…'; msg.innerHTML = '';
      t.after(() => {
        pay.disabled = false; pay.textContent = 'Pay €89.00';
        if (!fixed) { msg.innerHTML = '<p class="nh-joke">Whoopsie! Our payment hamsters tripped over their wheel. Try again later!</p>'; return; }
        if (good) { pay.hidden = true; msg.innerHTML = '<div class="nh-done">' + tick + '<span><b>Paid. Your shoes are on their way.</b><br>Arriving Thursday.</span></div>'; return; }
        msg.innerHTML = '<div class="nh-err" role="alert"><span><b>Your card was declined.</b> Your bank says this card expired in September. Use another card to pay.</span><button class="btn btn-secondary cs-sm" type="button" data-other style="align-self:flex-start">Use another card</button></div>';
        msg.querySelector('[data-other]').addEventListener('click', () => { good = true; card.textContent = 'Mastercard ending 5100'; msg.innerHTML = '<p class="cs-meta">Card changed. Press Pay to try again.</p>'; pay.focus(); });
      }, 700);
    });
  };
  D('good-needs-hierarchy-4b', payHtml, payWire(false));
  D('good-needs-hierarchy-4f', payHtml, payWire(true));

  csInit(cs);
  };
  if (window.csDemo) start(); else document.addEventListener('DOMContentLoaded', start);
})();

</script>
