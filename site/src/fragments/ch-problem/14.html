<div class="note comfy cw-wrap"><p>Notice how narrow each problem is: who, what they want, and what stops them. The frames are this book’s summary, not the companies’ own notes.</p>
  <div class="seg cw-seg" role="radiogroup" aria-label="Example">
    <input type="radio" name="cw-good-problem-framing-w" id="cw-good-problem-framing-w-1" value="gmail" checked><label for="cw-good-problem-framing-w-1">Gmail</label>
    <input type="radio" name="cw-good-problem-framing-w" id="cw-good-problem-framing-w-2" value="slack"><label for="cw-good-problem-framing-w-2">Slack</label>
    <input type="radio" name="cw-good-problem-framing-w" id="cw-good-problem-framing-w-3" value="uber"><label for="cw-good-problem-framing-w-3">Uber</label>
    <input type="radio" name="cw-good-problem-framing-w" id="cw-good-problem-framing-w-4" value="spotify"><label for="cw-good-problem-framing-w-4">Spotify</label>
  </div>
  <div class="cw cw-gpf-view" data-cw-view role="img" aria-label=""></div>
  <p class="cw-cap" data-cw-cap aria-live="polite"></p>
  
  <script>
  (() => {
    const wrap = document.currentScript.closest('.cw-wrap');
    const view = wrap.querySelector('[data-cw-view]'), cap = wrap.querySelector('[data-cw-cap]');
    const line = w => '<i class="cw-line" style="width:' + w + '%"></i>';
    const frame = (who, wants, stuck, answer) => '<div class="cw-gpf-row"><div class="cw-gpf-frame"><b>Problem</b><span><i>Who</i>' + who + '</span><span><i>Wants</i>' + wants + '</span><span><i>Stuck on</i>' + stuck + '</span></div>' +
      '<div class="cw-gpf-ans"><div class="cw-gpf-pair' + (answer.startsWith('<div class="cw-gpf-phone') ? ' ph' : '') + '"><b>Answer</b>' + answer + '</div></div></div>';
    const msg = (av, name, lines, extra) => '<div class="cw-gpf-msg"><span class="av' + av + '"></span><b>' + name + '</b>' + lines + (extra || '') + '</div>';
    const S = {
      gmail: { html: frame('Someone sending an email', 'To send it and move on', 'Seeing a mistake a second too late',
          '<div class="cw-gpf-win"><div class="cw-gpf-bar">Inbox</div><div class="cw-gpf-mail">' + line(90) + line(76) + line(84) + line(70) + line(80) +
          '<div class="toast">Message sent<span class="toast-action">Undo</span><span class="toast-action">View</span></div></div></div>'),
        alt: 'Problem frame: someone sending an email wants to send and move on, but spots a mistake a second too late. Answer: an inbox with a small notice in the corner, Message sent, with Undo.',
        cap: 'Gmail: Undo send holds each email for a few seconds and offers Undo in the corner. It solves the moment of regret without an “Are you sure?” before every send.' },
      slack: { html: frame('People in a busy channel', 'To talk one question through', 'Replies burying everything else',
          '<div class="cw-gpf-win"><div class="cw-gpf-split"><div class="cw-gpf-pane"><b># design</b>' +
          '<div class="cw-gpf-sel">' + msg('', 'Ana', line(88), '<span class="cw-gpf-rep">4 replies</span>') + '</div>' + msg(' b', 'Ben', line(70)) + msg(' c', 'Cy', line(80)) + '</div>' +
          '<div class="cw-gpf-pane"><b>Thread</b>' + msg('', 'Ana', line(88)) + msg(' b', 'Ben', line(60)) + msg(' c', 'Cy', line(75)) + '</div></div></div>'),
        alt: 'Problem frame: people in a busy channel want to talk one question through, but replies bury everything else. Answer: a channel where one message shows 4 replies, opened in a thread panel beside it.',
        cap: 'Slack: threads move the replies to one message into a side panel. The channel stays readable, and the side conversation still has a home.' },
      uber: { html: frame('A rider waiting for a pickup', 'To step outside at the right time', 'Not knowing where the car is',
          '<div class="cw-gpf-phone"><div class="cw-gpf-map"><svg viewBox="0 0 220 120" preserveAspectRatio="none" aria-hidden="true">' +
          '<path d="M30 96 L30 68 L108 68 L108 38 L176 38" fill="none" stroke="var(--ui-sel)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<rect x="20" y="88" width="20" height="13" rx="4" fill="var(--ui-text)"/>' +
          '<circle cx="182" cy="34" r="9" fill="var(--ui-sel)"/><circle cx="182" cy="34" r="3.5" fill="var(--ui-surface)"/></svg></div>' +
          '<div class="cw-gpf-sheet"><b>Arriving in 4 min</b><span><i class="av"></i>Gray sedan · ABC 123</span></div></div>'),
        alt: 'Problem frame: a rider waiting for a pickup wants to step outside at the right time, but doesn’t know where the car is. Answer: a map with the car on a route to the pickup pin, and a card saying Arriving in 4 min, with the car and plate.',
        cap: 'Uber: shows the car moving on the map, the minutes until pickup, and the car and its plate. Waiting becomes something riders can plan around.' },
      spotify: { html: frame('A listener tired of their own library', 'New songs they’ll like', 'Not knowing what to search for',
          '<div class="cw-gpf-phone"><div class="cw-gpf-pl"><div class="cw-gpf-pl-head"><span class="cw-gpf-cover"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg></span><span><b>Your weekly mix</b><small>New songs for you, every week</small></span></div>' +
          ['', '', '', ''].map((_, i) => '<div class="cw-gpf-track"><i></i><span>' + line(80 - i * 8) + line(50 + i * 6) + '</span></div>').join('') + '</div></div>'),
        alt: 'Problem frame: a listener tired of their own library wants new songs they’ll like, but doesn’t know what to search for. Answer: a playlist of new songs made for them, refreshed every week.',
        cap: 'Spotify: Discover Weekly is a fresh playlist picked for each listener every week. It removes the search step instead of making search better.' }
    };
    const render = k => { view.innerHTML = S[k].html; view.setAttribute('aria-label', 'Sketch: ' + S[k].alt); cap.textContent = S[k].cap; };
    wrap.querySelectorAll('input[name="cw-good-problem-framing-w"]').forEach(r => r.addEventListener('change', () => render(r.value)));
    render('gmail');
  })();
  </script>
</div>
