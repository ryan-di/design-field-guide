<div class="stage tall" data-demo="toast">
      <div class="row">
        <button class="btn btn-primary" type="button" data-act="save">Save playlist</button>
        <button class="btn btn-secondary" type="button" data-act="delete">Remove a song</button>
        <button class="btn btn-ghost" type="button" data-act="error">Show an error as a toast</button>
      </div>
      <div class="row" data-nodes aria-label="Songs in the playlist">
        <span class="node">Morning Light</span><span class="node">Slow River</span><span class="node">Paper Boats</span>
      </div>
      <p class="try"><b>Try it:</b> remove a song, then press Undo. Then show the error toast and look away for a few seconds.</p>
    </div>
