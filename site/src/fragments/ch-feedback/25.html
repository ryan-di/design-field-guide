<div class="stage" data-demo="badge">
      <div class="row">
        <span class="badge-wrap"><button class="btn btn-secondary" type="button" id="d-queue" aria-label="Cart, 3 items">Cart</button><span class="badge" aria-hidden="true">3</span></span>
      </div>
      <div class="row">
        <button class="btn btn-primary" type="button" data-act="add"><svg class="icon sm"><use href="#i-plus"/></svg>Add to cart</button>
        <button class="btn btn-secondary" type="button" data-act="add50">Add 120 items</button>
        <button class="btn btn-ghost" type="button" data-act="finish">Remove one</button>
        <button class="btn btn-ghost" type="button" data-act="clear">Empty cart</button>
      </div>
      <p class="try"><b>Try it:</b> add 120 items and watch the badge cap at 99+, then empty the cart.</p>
    </div>
