<div class="stage tall" data-demo="pat-fitts-law">
      <div class="seg" role="radiogroup" aria-label="Target size and distance">
        <input type="radio" name="p17-fitts" id="p17-fitts-far" value="far" checked><label for="p17-fitts-far">Tiny, far</label>
        <input type="radio" name="p17-fitts" id="p17-fitts-near" value="near"><label for="p17-fitts-near">Big, near</label>
      </div>
      <div class="p17-arena" data-arena data-mode="far">
        <button class="p17-target" type="button" data-t="0"></button>
        <button class="p17-target" type="button" data-t="1"></button>
      </div>
      <p class="result" data-status aria-live="polite">Click the lit target to start.</p>
      <p class="p17-scores"><span>Tiny, far: <b data-score="far">–</b></span><span>Big, near: <b data-score="near">–</b></span></p>
      <p class="try"><b>Try it:</b> in “Tiny, far”, click the lit dot until it says done. Then switch to “Big, near”, go again, and compare the averages and the misses. Tab and Enter work too, but this law is about pointing.</p>
    </div>
