<script>
(() => {
  const cs = document.currentScript.closest('.cs');
  const run = () => {
  const D = (k, html, wire) => csDemo(cs.querySelector('[data-d="' + k + '"]'), html, wire);
  const css = document.createElement('style');
  css.textContent = [
    '#pat-background-work .bw-app{width:min(340px,100%);position:relative}',
    '#pat-background-work .bw-tabs{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--ui-border);background:var(--ui-surface)}',
    '#pat-background-work .bw-body{min-height:190px}',
    '#pat-background-work .bw-map{width:100%;aspect-ratio:auto;height:90px}',
    '#pat-background-work .bw-prog{display:flex;flex-direction:column;gap:6px}',
    '#pat-background-work .bw-prog .bar{height:6px}',
    '#pat-background-work .bw-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--ui-sel-soft);color:var(--ui-text);font:600 12.5px var(--font-body);white-space:nowrap}',
    '#pat-background-work .bw-pill .bar{width:40px;height:5px}',
    '#pat-background-work .bw-pill .icon{width:14px;height:14px}',
    '#pat-background-work .bw-pill.ok .icon{color:var(--ui-ok)}',
    '#pat-background-work .bw-pill.bad{background:var(--ui-danger-soft);color:var(--ui-danger)}',
    '#pat-background-work .bw-pop{position:absolute;top:46px;right:8px;width:min(230px,calc(100% - 16px));padding:10px;display:flex;flex-direction:column;gap:6px;z-index:2;font-size:13.5px}',
    '#pat-background-work .bw-pop[hidden]{display:none}',
    '#pat-background-work .bw-file{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:7px;font-size:13.5px}',
    '#pat-background-work .bw-file:hover{background:var(--ui-hover)}',
    '#pat-background-work .bw-file:focus-visible{outline:2px solid var(--ui-sel)}',
    '#pat-background-work .bw-new{font:700 12px var(--font-body);color:var(--ui-sel)}',
    '#pat-background-work .bw-art{width:30px;height:30px;aspect-ratio:auto;border-radius:6px;flex:none}',
    '#pat-background-work .bw-songs{gap:0;padding:6px 14px}',
    '#pat-background-work .bw-st{display:inline-flex;align-items:center;gap:4px;color:var(--ui-muted);font:500 12.5px var(--font-mono)}',
    '#pat-background-work .bw-st .icon{width:15px;height:15px}',
    '#pat-background-work .bw-st .spinner{width:13px;height:13px;border-width:2px}',
    '#pat-background-work .cs-row.bw-hl{background:var(--ui-sel-soft)}',
    '#pat-background-work .bw-fail{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-left:3px solid var(--ui-danger);background:var(--ui-danger-soft);border-radius:0 8px 8px 0;font-size:13.5px}',
    '#pat-background-work .bw-fail b{color:var(--ui-danger)}',
    '#pat-background-work .bw-fail .btn{align-self:flex-start}',
    '#pat-background-work .bw-files .cs-row .grow{white-space:normal}',
    '#pat-background-work .bw-app .app-body > .btn{align-self:flex-start}'
  ].join('\n');
  cs.appendChild(css);
  const icon = n => '<svg class="icon sm" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
  const bar = p => '<span class="bar"><span style="width:' + p + '%"></span></span>';
  const setBar = (el, p) => { const s = el && el.querySelector('.bar > span'); if (s) s.style.width = p + '%'; };

  /* 1. Progress only where it started */
  const TABS = ['Map', 'Trips', 'Saved'];
  const LISTS = [null, [['Lisbon', '12–16 Nov'], ['Porto', '2–4 Dec'], ['Madrid', 'Jan 2027']], [['Time Out Market', 'Food hall'], ['Belém Tower', 'Sight'], ['LX Factory', 'Shops']]];
  const mapHtml = '<div class="app-frame bw-app"><div class="app-bar"><span>Travel</span><span data-ind></span></div>' +
    '<div class="bw-tabs" role="group" aria-label="Sections">' + TABS.map((n, i) => '<button type="button" class="cs-tab' + (i ? '' : ' on') + '" aria-pressed="' + !i + '" data-tab="' + i + '">' + n + '</button>').join('') + '</div>' +
    '<div class="app-body bw-body" data-body></div></div>';
  const mapWire = fixed => (d, t) => {
    const body = d.querySelector('[data-body]'), ind = d.querySelector('[data-ind]');
    let tab = 0, p = -1, timer = null;
    const drawBody = () => {
      if (tab === 0) {
        body.innerHTML = '<div class="thumb bw-map"></div><b>Lisbon offline map</b>' +
          (p < 0 ? '<button class="btn btn-primary cs-sm" type="button" data-dl>Download · 120 MB</button>'
            : p < 100 ? (fixed ? '<p class="cs-meta">Downloading. You can keep using the app.</p>' : '<div class="bw-prog" data-prog><span class="cs-meta" data-pct>Downloading… ' + p + '%</span>' + bar(p) + '</div>')
              : '<p class="cs-ok">Ready to use offline.</p>');
        const b = body.querySelector('[data-dl]');
        if (b) b.addEventListener('click', start);
      } else {
        body.innerHTML = LISTS[tab].map(r => '<div class="cs-row"><span class="grow"><b>' + r[0] + '</b></span><span class="cs-meta">' + r[1] + '</span></div>').join('');
      }
    };
    const drawInd = () => {
      if (!fixed) return;
      if (p < 0) ind.innerHTML = '';
      else if (p < 100) {
        if (!ind.querySelector('[data-pill]')) ind.innerHTML = '<span class="bw-pill" data-pill><span data-pct></span>' + bar(p) + '</span>';
        ind.querySelector('[data-pct]').textContent = 'Map ' + p + '%';
        setBar(ind, p);
      } else ind.innerHTML = '<span class="bw-pill ok" role="status">' + icon('check') + 'Map ready</span>';
    };
    const start = () => {
      p = 0; drawBody(); drawInd();
      d.querySelector('[data-tab="1"]').focus();
      timer = t.every(() => {
        p = Math.min(100, p + 2);
        if (p >= 100) { clearInterval(timer); drawBody(); drawInd(); if (fixed) t.after(() => { ind.innerHTML = ''; }, 4000); return; }
        drawInd();
        if (tab === 0 && !fixed) { const pct = body.querySelector('[data-pct]'); if (pct) pct.textContent = 'Downloading… ' + p + '%'; setBar(body, p); }
      }, 160);
    };
    d.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
      tab = +b.dataset.tab;
      d.querySelectorAll('[data-tab]').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', String(on)); });
      drawBody();
    }));
    drawBody(); drawInd();
  };
  D('pat-background-work-1b', mapHtml, mapWire(false));
  D('pat-background-work-1f', mapHtml, mapWire(true));

  /* 2. Missed "ready" message */
  const bankHtml = fixed => '<div class="app-frame bw-app"><div class="app-bar"><span>Bank</span>' +
    (fixed ? '<span class="badge-wrap"><button class="btn btn-ghost cs-sm" type="button" aria-expanded="false" data-dls>Downloads</button><span class="badge" data-badge hidden>1</span></span>' : '') + '</div>' +
    '<div class="app-body"><div class="cs-row"><span class="grow">Everyday account</span><b>€2,418.50</b></div><div class="cs-row"><span class="grow">Savings</span><b>€9,200.00</b></div>' +
    '<button class="btn btn-secondary cs-sm" type="button" data-exp>Export September statement</button><p class="cs-ok" data-out></p></div>' +
    (fixed ? '<div class="bw-pop surface" data-dlpop hidden><b>Downloads</b><div data-list><p class="cs-meta">Nothing yet.</p></div></div>' : '') + '</div>';
  const bankWire = fixed => (d, t) => {
    const exp = d.querySelector('[data-exp]'), out = d.querySelector('[data-out]');
    const FILE = 'statement-sep-2026.pdf';
    const open = () => {
      out.textContent = 'Opened ' + FILE + '.';
      if (!fixed) return;
      const n = d.querySelector('[data-list] .bw-new'); if (n) n.remove();
      d.querySelector('[data-badge]').hidden = true;
    };
    exp.addEventListener('click', () => {
      exp.disabled = true; exp.textContent = 'Preparing…'; out.textContent = '';
      t.after(() => {
        exp.disabled = false; exp.textContent = 'Export September statement';
        csToast(d, t, 'Statement ready', { ms: 3000, replace: true, action: { label: 'Open', run: open } });
        if (fixed) {
          d.querySelector('[data-list]').innerHTML = '<button type="button" class="bw-file" data-file><span>' + FILE + '</span><span class="bw-new">New</span></button>';
          d.querySelector('[data-file]').addEventListener('click', () => { open(); setPop(false); d.querySelector('[data-dls]').focus(); });
          d.querySelector('[data-badge]').hidden = false;
        }
      }, 1800);
    });
    if (!fixed) return;
    const btn = d.querySelector('[data-dls]'), pop = d.querySelector('[data-dlpop]');
    const setPop = on => { pop.hidden = !on; btn.setAttribute('aria-expanded', String(on)); };
    btn.addEventListener('click', () => { setPop(pop.hidden); const f = pop.querySelector('[data-file]'); if (!pop.hidden && f) f.focus(); });
    pop.addEventListener('keydown', e => { if (e.key === 'Escape') { setPop(false); btn.focus(); } });
  };
  D('pat-background-work-2b', bankHtml(false), bankWire(false));
  D('pat-background-work-2f', bankHtml(true), bankWire(true));

  /* 3. One message per song */
  const SONGS = ['Golden hour', 'Night drive', 'Coastline', 'Paper planes', 'Slow wave', 'Blue room'];
  const songHtml = '<div class="app-frame bw-app"><div class="app-bar"><span>Road trip · 6 songs</span><button class="btn btn-primary cs-sm" type="button" data-all>Download all</button></div>' +
    '<div class="app-body bw-songs">' + SONGS.map((s, i) => '<div class="cs-row" data-song><span class="thumb bw-art' + ['', ' b', ' c'][i % 3] + '"></span><span class="grow">' + s + '</span><span class="bw-st" data-st></span></div>').join('') + '</div></div>';
  const songWire = fixed => (d, t) => {
    const all = d.querySelector('[data-all]'), rows = Array.from(d.querySelectorAll('[data-song]'));
    all.addEventListener('click', () => {
      all.disabled = true;
      rows.forEach(r => { r.querySelector('[data-st]').innerHTML = '<span class="spinner"></span>'; });
      SONGS.forEach((s, i) => t.after(() => {
        rows[i].querySelector('[data-st]').innerHTML = icon('check') + 'Saved';
        if (!fixed) csToast(d, t, 'Downloaded “' + s + '”', { ms: 7000 });
        else if (i === SONGS.length - 1) csToast(d, t, '6 songs downloaded', { ms: 6000, action: { label: 'View', run: () => {
          rows.forEach(r => r.classList.add('bw-hl'));
          t.after(() => rows.forEach(r => r.classList.remove('bw-hl')), 1600);
          all.textContent = 'Downloaded'; all.focus();
        } } });
      }, 900 + i * 260));
    });
  };
  D('pat-background-work-3b', songHtml, songWire(false));
  D('pat-background-work-3f', songHtml, songWire(true));

  /* 4. Quiet failure */
  const FILES = ['passport-scan.pdf', 'tax-return-2025.pdf', 'lease.pdf', 'photos-2026.zip'];
  const backHtml = '<div class="app-frame bw-app"><div class="app-bar"><span>Backup</span><span data-ind></span></div>' +
    '<div class="app-body bw-files">' + FILES.map(f => '<div class="cs-row" data-file><span class="grow">' + f + '</span><span class="bw-st" data-st></span></div>').join('') +
    '<div data-fail></div><button class="btn btn-secondary cs-sm" type="button" data-go>Back up now</button></div></div>';
  const backWire = fixed => (d, t) => {
    const go = d.querySelector('[data-go]'), ind = d.querySelector('[data-ind]'), fail = d.querySelector('[data-fail]');
    const rows = Array.from(d.querySelectorAll('[data-file]')), st = i => rows[i].querySelector('[data-st]');
    const pill = (cls, html) => { ind.innerHTML = '<span class="bw-pill' + (cls ? ' ' + cls : '') + '">' + html + '</span>'; };
    go.addEventListener('click', () => {
      go.disabled = true; fail.innerHTML = '';
      rows.forEach((r, i) => { st(i).innerHTML = ''; });
      let p = 0;
      const timer = t.every(() => {
        p += 5;
        pill('', 'Backing up 4 files' + bar(p)); setBar(ind, p);
        const k = Math.floor(p / 25) - 1;
        if (p % 25 === 0 && k >= 0 && k < 3) st(k).innerHTML = icon('check') + 'Saved';
        if (p < 100) return;
        clearInterval(timer);
        go.disabled = false;
        if (!fixed) {
          st(3).innerHTML = 'skipped';
          ind.innerHTML = '';
          csToast(d, t, 'Backup finished', { ms: 4000 });
          return;
        }
        st(3).innerHTML = '<b style="color:var(--ui-danger)">Failed</b>';
        pill('bad', icon('warn') + '1 file didn’t back up');
        csToast(d, t, 'photos-2026.zip didn’t back up', { ms: 4000, tone: 'error' });
        fail.innerHTML = '<div class="bw-fail" role="alert"><span><b>photos-2026.zip didn’t back up.</b> The connection dropped at 60%. Your other files are safe.</span><button class="btn btn-secondary cs-sm" type="button" data-retry>Retry</button></div>';
        fail.querySelector('[data-retry]').addEventListener('click', () => {
          fail.innerHTML = '';
          st(3).innerHTML = '<span class="spinner"></span>';
          pill('', 'Backing up 1 file');
          go.focus();
          t.after(() => {
            st(3).innerHTML = icon('check') + 'Saved';
            pill('ok', icon('check') + 'All 4 files backed up');
            t.after(() => { ind.innerHTML = ''; }, 3000);
          }, 1400);
        });
      }, 140);
    });
  };
  D('pat-background-work-4b', backHtml, backWire(false));
  D('pat-background-work-4f', backHtml, backWire(true));

  csInit(cs);
  };
  if (window.csDemo) run(); else document.addEventListener('DOMContentLoaded', run);
})();

</script>
