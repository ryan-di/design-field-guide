<script>
(() => {
  const cs = document.currentScript.closest('.cs');
  /* This entry sits before the shared case helpers in the book, so start once they exist. */
  const go = () => {
  const D = (k, html, wire) => csDemo(cs.querySelector('[data-d="' + k + '"]'), html, wire);
  const P = '#pat-forgiving-input ';
  const css = document.createElement('style');
  css.textContent = [
    P + '.pf-form h5{margin:0;font:700 14.5px var(--font-body)}',
    P + '.pf-form .field-help{font-weight:400;line-height:1.4}',
    P + '.pf-form .field-msg{font-weight:400}',
    P + '.pf-form > .btn{align-self:flex-start}',
    P + '.pf-read{font:500 13px var(--font-body);color:var(--ui-text);padding:7px 10px;border-radius:8px;background:var(--ui-sel-soft)}',
    P + '.pf-read:empty{display:none}',
    P + '.pf-price{display:flex;justify-content:space-between;font-size:14px;padding-top:8px;border-top:1px solid var(--ui-border)}',
    P + '.pf-price b{font-variant-numeric:tabular-nums}',
    P + '.pf-ask{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13.5px}',
    P + '.pf-ask[hidden]{display:none}',
    P + '.pf-ev{display:flex;gap:8px;align-items:center;font-size:14px;padding:8px 10px;border-radius:8px;border-left:3px solid var(--ui-sel);background:var(--ui-surface)}',
    P + '.pf-ev b{font-variant-numeric:tabular-nums}',
    P + '.pf-ep{display:flex;gap:10px;align-items:center}',
    P + '.pf-ep .thumb{width:44px;height:44px;aspect-ratio:auto;flex:none}',
    P + '.pf-ep span{display:flex;flex-direction:column;font-size:13.5px}'
  ].join('\n');
  cs.appendChild(css);

  const icon = n => '<svg class="icon"><use href="#i-' + n + '"/></svg>';
  const msgEl = k => '<p class="field-msg" data-msg="' + k + '" hidden>' + icon('warn') + '<span></span></p>';
  const setMsg = (d, k, t) => { const m = d.querySelector('[data-msg="' + k + '"]'); m.hidden = !t; m.querySelector('span').textContent = t || ''; };
  const say = (d, t) => { d.querySelector('[data-out]').textContent = t; };
  const num = v => (Math.round(v * 100) / 100).toLocaleString('en-US');

  /* 1. Silent wrong guess (parcel weight) */
  const shipHtml = '<div class="cs-form pf-form"><h5>Send a parcel · to Porto</h5><label class="cs-f">Weight in kg<input class="input" autocomplete="off" spellcheck="false" data-kg></label>' +
    '<p class="pf-read" data-read></p><div class="pf-price"><span>Shipping</span><b data-price>–</b></div></div>';
  const shipWire = fixed => d => {
    const kg = d.querySelector('[data-kg]'), read = d.querySelector('[data-read]'), price = d.querySelector('[data-price]');
    kg.addEventListener('input', () => {
      const raw = kg.value.trim().toLowerCase();
      let v;
      if (!fixed) v = parseFloat(raw.replace(/[^0-9.]/g, ''));
      else {
        const m = raw.replace(',', '.').match(/^(\d*\.?\d+)\s*(kg|kilos?|g|grams?)?$/);
        v = m ? parseFloat(m[1]) / (m[2] && m[2][0] === 'g' ? 1000 : 1) : NaN;
        read.textContent = !raw ? '' : isFinite(v) ? 'Read as ' + num(v) + ' kg.' : 'Couldn’t read a weight. Try a number, like 2.5.';
      }
      price.textContent = isFinite(v) && v > 0 ? '$' + (4 + 1.5 * v).toFixed(2) : '–';
    });
  };
  D('pat-forgiving-input-1b', shipHtml, shipWire(false));
  D('pat-forgiving-input-1f', shipHtml, shipWire(true));

  /* 2. Ambiguous input taken silently (event time) */
  const clock = (h, m) => ((h + 11) % 12 + 1) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' am' : ' pm');
  const readTime = raw => {
    const m = raw.trim().toLowerCase().replace(/\s+/g, '').replace(/\.m\.?$/, 'm').match(/^(\d{1,2})(?:[:.](\d{2}))?(am|pm|a|p)?$/);
    if (!m) return null;
    let h = Number(m[1]); const min = Number(m[2] || 0);
    if (h > 23 || min > 59) return null;
    if (m[3]) { if (h < 1 || h > 12) return null; h = h % 12 + (m[3][0] === 'p' ? 12 : 0); return { h, min }; }
    if (h === 0 || h > 12 || /^0\d/.test(m[1])) return { h, min };
    return { h, min, two: true };
  };
  const timeHtml = '<div class="cs-form pf-form"><h5>New event · Fri 30 Oct</h5><label class="cs-f">Title<input class="input" value="Dinner with Ana" autocomplete="off"></label>' +
    '<label class="cs-f">Time<input class="input" autocomplete="off" spellcheck="false" data-t></label>' + msgEl('t') +
    '<div class="pf-ask" data-ask hidden><span>Morning or evening?</span><button class="btn btn-secondary cs-sm" type="button" data-pick="am"></button><button class="btn btn-secondary cs-sm" type="button" data-pick="pm"></button></div>' +
    '<button class="btn btn-primary cs-sm" type="button" data-add>Add</button></div><div data-ev></div>';
  const timeWire = fixed => d => {
    const t = d.querySelector('[data-t]'), ask = d.querySelector('[data-ask]'), ev = d.querySelector('[data-ev]');
    let pending = null;
    const add = (h, min) => {
      ask.hidden = true; setMsg(d, 't', '');
      ev.innerHTML = '<div class="pf-ev">' + d.querySelector('.cs-f input').value + ' · Fri <b>' + clock(h, min) + '</b></div>';
    };
    t.addEventListener('input', () => { ask.hidden = true; setMsg(d, 't', ''); });
    d.querySelector('[data-add]').addEventListener('click', () => {
      const r = readTime(t.value);
      if (!r) { setMsg(d, 't', 'Couldn’t read a time. Try 7pm or 19:00.'); return; }
      if (r.two && fixed) {
        pending = r; ask.hidden = false; ev.innerHTML = '';
        ask.querySelector('[data-pick="am"]').textContent = clock(r.h % 12, r.min);
        ask.querySelector('[data-pick="pm"]').textContent = clock(r.h % 12 + 12, r.min);
        ask.querySelector('[data-pick="pm"]').focus();
        return;
      }
      add(r.two ? r.h % 12 : r.h, r.min);
    });
    ask.addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (b && pending) add(pending.h % 12 + (b.dataset.pick === 'pm' ? 12 : 0), pending.min); });
  };
  D('pat-forgiving-input-2b', timeHtml, timeWire(false));
  D('pat-forgiving-input-2f', timeHtml, timeWire(true));

  /* 3. Each field forgives differently (podcast) */
  const UNIT = { h: 3600, m: 60, s: 1 };
  const readDur = raw => {
    const s = raw.trim().toLowerCase();
    if (!s) return null;
    let m = s.match(/^(\d+):(\d{1,2})(?::(\d{1,2}))?$/);
    if (m) return m[3] !== undefined ? m[1] * 3600 + m[2] * 60 + Number(m[3]) : m[1] * 60 + Number(m[2]);
    if (/^\d+(\.\d+)?$/.test(s)) return Math.round(parseFloat(s) * 60);
    const re = /(\d+(?:\.\d+)?)\s*(h|hrs?|hours?|m|mins?|minutes?|s|secs?|seconds?)\b/g;
    let total = 0, used = '';
    while ((m = re.exec(s))) { total += parseFloat(m[1]) * UNIT[m[2][0]]; used += m[0]; }
    return used && s.replace(re, '').replace(/\band\b|[\s,]/g, '') === '' ? Math.round(total) : null;
  };
  const say3 = sec => { const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = sec % 60; return [h && h + ' h', m && m + ' min', x && x + ' s'].filter(Boolean).join(' ') || '0 s'; };
  const podHtml = fixed => '<div class="cs-form pf-form"><div class="pf-ep"><span class="thumb c"></span><span><b>Slow Mornings</b>Episode 41 · 58 min</span></div>' +
    '<label class="cs-f">Skip to<input class="input" autocomplete="off" spellcheck="false" data-f="skip"><span class="field-help" data-h="skip">' + (fixed ? 'Like 12:30, 12m 30s or 45 min.' : 'Use mm:ss.') + '</span></label>' + msgEl('skip') +
    '<label class="cs-f">Sleep timer<input class="input" autocomplete="off" spellcheck="false" data-f="sleep"><span class="field-help" data-h="sleep">' + (fixed ? 'Like 45 min, 1h or 1:30:00.' : 'In minutes.') + '</span></label>' + msgEl('sleep') + '</div>';
  const podWire = fixed => d => {
    d.querySelectorAll('[data-f]').forEach(inp => {
      const k = inp.dataset.f, help = d.querySelector('[data-h="' + k + '"]'), HELP = help.textContent;
      inp.addEventListener('input', () => { setMsg(d, k, ''); help.textContent = HELP; });
      inp.addEventListener('change', () => {
        const raw = inp.value.trim();
        if (!raw) return;
        let sec = null;
        if (fixed) sec = readDur(raw);
        else if (k === 'skip') { const m = raw.match(/^(\d+):(\d{2})$/); if (m) sec = m[1] * 60 + Number(m[2]); }
        else if (/^\d+$/.test(raw)) sec = Number(raw) * 60;
        if (sec === null) { setMsg(d, k, fixed ? 'Couldn’t read a time. Try 12:30 or 45 min.' : k === 'skip' ? 'Use mm:ss, like 12:30.' : 'Enter minutes, like 45.'); inp.setAttribute('aria-invalid', 'true'); return; }
        inp.setAttribute('aria-invalid', 'false');
        help.textContent = (k === 'skip' ? 'Jumped to ' : 'Stops playing in ') + say3(sec) + '.';
      });
    });
  };
  D('pat-forgiving-input-3b', podHtml(false), podWire(false));
  D('pat-forgiving-input-3f', podHtml(true), podWire(true));

  /* 4. Quietly changing the value (photo prints) */
  const SIZES = [[10, 15], [13, 18], [15, 20], [20, 30], [30, 45]];
  const nearest = (a, b) => SIZES.reduce((best, s) => Math.abs(s[0] - a) + Math.abs(s[1] - b) < Math.abs(best[0] - a) + Math.abs(best[1] - b) ? s : best);
  const printHtml = '<div class="cs-form pf-form"><h5>Print photos · beach.jpg</h5><label class="cs-f">Print size in cm<input class="input" value="13 x 18" autocomplete="off" spellcheck="false" data-p>' +
    '<span class="field-help" data-h>Sizes from 10 × 15 to 30 × 45 cm.</span></label>' + msgEl('p') + '<div class="pf-price"><span>Size ordered</span><b data-got>13 × 18 cm</b></div></div>';
  const printWire = fixed => d => {
    const p = d.querySelector('[data-p]'), help = d.querySelector('[data-h]'), got = d.querySelector('[data-got]'), HELP = help.textContent;
    p.addEventListener('input', () => setMsg(d, 'p', ''));
    p.addEventListener('change', () => {
      const n = (p.value.match(/\d+(?:\.\d+)?/g) || []).map(Number);
      help.textContent = HELP;
      if (n.length !== 2) { setMsg(d, 'p', 'Give two numbers, like 10 x 15.'); return; }
      const [a, b] = n[0] <= n[1] ? n : [n[1], n[0]];
      if (fixed && (b > 60 || a < 7)) { setMsg(d, 'p', 'We can’t print ' + n[0] + ' × ' + n[1] + ' cm. The largest print is 30 × 45 cm.'); p.setAttribute('aria-invalid', 'true'); return; }
      p.setAttribute('aria-invalid', 'false');
      const s = nearest(a, b), same = s[0] === a && s[1] === b;
      p.value = s[0] + ' × ' + s[1] + ' cm';
      got.textContent = s[0] + ' × ' + s[1] + ' cm';
      if (fixed && !same) help.textContent = 'Changed ' + n[0] + ' × ' + n[1] + ' to ' + s[0] + ' × ' + s[1] + ' cm, the nearest print size.';
    });
  };
  D('pat-forgiving-input-4b', printHtml, printWire(false));
  D('pat-forgiving-input-4f', printHtml, printWire(true));

  csInit(cs);
  };
  if (window.csDemo) go(); else document.addEventListener('DOMContentLoaded', go);
})();

</script>
